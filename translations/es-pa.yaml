settings:
  telematics:
    telematics-settings: Configuración de telemática
    intro: Elija cuánto tiempo conserva su organización los eventos de dispositivos y el historial de posiciones, dentro de los límites establecidos por el administrador del sistema.
    use-system-default: Usar valor predeterminado del sistema
    history-policy-maximum: Su administrador permite hasta {days} días de historial. La retención ilimitada no está disponible.
    history-policy-unlimited: Su administrador permite un historial ilimitado. Establezca el período de retención en 0 para conservar el historial indefinidamente.
    device-events: Retención de eventos de dispositivos
    event-retention-days: Conservar eventos de dispositivos durante (días)
    event-retention-days-help: Los eventos con más antigüedad se eliminan de forma permanente. Se aplica tanto a las actualizaciones de telemetría como a las alertas del proveedor.
    event-compact-after-days: Eliminar cargas útiles sin procesar después de (días)
    event-compact-after-days-help: Los eventos con más antigüedad conservan su tipo, gravedad, ubicación y datos normalizados, pero se elimina la carga sin procesar del proveedor. Las cargas sin procesar representan la mayor parte del tamaño de cada evento.
    compaction-warning: Los datos sin procesar solo se eliminan de los eventos que se conservan. Establezca un valor menor que la retención de eventos o establézcalo en 0 para desactivar la compactación.
    positions: Retención del historial de posiciones
    position-retention-days: Conservar posiciones durante (días)
    position-retention-days-help: El historial de posiciones de vehículos y remolques con más antigüedad se elimina de forma permanente. La reproducción de rutas y las vistas de historial solo llegan hasta este límite.
    inbox: Retención de bandeja de entrega y ejecuciones de sincronización
    processed-retention-hours: Conservar entregas procesadas durante (horas)
    processed-retention-hours-help: Los lotes sin procesar del proveedor se almacenan cifrados hasta que se procesan y se conservan brevemente para reproducción y diagnóstico. Cada lote puede ocupar cerca de un megabyte.
    quarantine-retention-days: Conservar entregas en cuarentena durante (días)
    quarantine-retention-days-help: Los lotes que no se pudieron procesar permanecen disponibles para inspección y reproducción durante este tiempo.
    sync-run-retention-days: Conservar diagnósticos de ejecuciones de sincronización durante (días)
    sync-run-retention-days-help: Se registra una fila de ejecución de sincronización por conexión en cada sondeo. Las ejecuciones en curso nunca se eliminan.
    activity-logging: Registro de actividad de telemetría
    log-telemetry-activity: Registrar actividad de telemetría
    log-telemetry-activity-help: Registrar en el registro de actividad los guardados de dispositivos, eventos y vehículos generados por la telemetría. Desactivado de forma predeterminada; de lo contrario, cada sondeo agrega varias filas de actividad por dispositivo.
    storage-usage: Uso de almacenamiento de telemática del sistema
    table: Tabla
    rows: Filas
    estimated-rows: "{count} (estimado)"
    estimated-size: Tamaño estimado
    oldest: Fila más antigua
    not-available: N/D
    raw-payload-rows: "Filas que aún contienen cargas sin procesar: {count}; aptas para compactación ahora: {compactable}"
    refresh: Actualizar
    run-cleanup: Ejecutar limpieza del sistema
    run-cleanup-confirm: Esto pone en cola la limpieza de telemática para todas las organizaciones, según la política del sistema guardada y las preferencias de historial vigentes de cada organización. Los registros vencidos se eliminan de forma permanente y no se pueden recuperar. ¿Desea continuar?
    cleanup-queued: La limpieza de telemática se puso en cola para todas las organizaciones. El uso se actualizará en breve; es posible que la limpieza siga en curso.
    cleanup-unavailable: No se pudo confirmar la limpieza de telemática en todo el sistema. Inténtelo de nuevo.
    usage-unavailable: No se pudo cargar el uso de almacenamiento. Seleccione Actualizar para intentarlo de nuevo.
    space-reclaim-note: El uso incluye todos los datos de telemática del sistema. Los recuentos de filas marcados como estimados usan estadísticas de la base de datos. Los tamaños incluyen los datos de las tablas y los índices. Eliminar registros libera espacio para reutilizarlo dentro de la base de datos; es posible que el uso físico del disco no disminuya de inmediato.
